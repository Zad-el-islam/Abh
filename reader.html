:root {
  color-scheme: light;
  --color-bg: #f7f6f1;
  --color-surface: #fffefa;
  --color-surface-alt: #edeFe8;
  --color-text: #252d28;
  --color-muted: #5d685f;
  --color-border: #dce0d7;
  --color-brand: #275b45;
  --color-brand-hover: #194932;
  --color-accent: #806630;
  --color-danger: #a83434;
  --color-success: #276845;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 3px 14px #162b1e08;
  --shadow-lg: 0 18px 65px #10281a25;
  --font-ui: 'Zad Sans',Tahoma,Arial,sans-serif;
  --font-quran: Amiri,'Traditional Arabic',serif;
  --font-size-reader: 1.75rem;
  --font-size-content: 1rem;
  --content-width-wide: 1120px;
  --content-width-reading: 860px;
  --bg: var(--color-bg);
  --card: var(--color-surface);
  --card2: var(--color-surface-alt);
  --text: var(--color-text);
  --muted: var(--color-muted);
  --line: var(--color-border);
  --gold: var(--color-accent);
  --green: var(--color-brand);
  --red: var(--color-danger);}
:root[data-theme=dark] {
  color-scheme: dark;
  --color-bg: #141d18;
  --color-surface: #1c2720;
  --color-surface-alt: #253329;
  --color-text: #eeefe8;
  --color-muted: #afbbb0;
  --color-border: #38483b;
  --color-brand: #a5c7ac;
  --color-brand-hover: #c1d8c5;
  --color-accent: #d1b875;
  --color-danger: #f29a96;
  --color-success: #a5c7ac;}
:root[data-reader-size=small] {
  --font-size-reader: 1.5rem;
  --font-size-content: .9rem;}
:root[data-reader-size=large] {
  --font-size-reader: 2.05rem;
  --font-size-content: 1.15rem;}
:root[data-reader-size=xlarge] {
  --font-size-reader: 2.4rem;
  --font-size-content: 1.3rem;}
* {
  box-sizing: border-box;
}
html {
  scroll-padding-top: 100px;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.85 var(--font-ui);
  min-width: 280px;
}
button,input,select,textarea {
  font: inherit;
}
h1,h2,h3,h4,p {
  margin: 0 0 12px;
}
h1 {
  font-size: 2rem;
  line-height: 1.65;
  font-weight: 650;
}
h2 {
  font-size: 1.3rem;
  font-weight: 650;
  line-height: 1.7;
}
h3 {
  font-size: 1.1rem;
  line-height: 1.8;
}
small {
  font-size: .8rem;
}
a {
  color: var(--color-brand);
  text-underline-offset: 5px;
}
a:hover {
  color: var(--color-brand-hover);
}
button,.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 9px 17px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--color-brand);
  color: var(--color-surface);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s,border-color .15s;
  line-height: 1.6;
}
button:hover,.button:hover {
  background: var(--color-brand-hover);
  color: var(--color-surface);
}
button:disabled {
  cursor: not-allowed;
  opacity: .6;
}
.secondary,.button.secondary {
  background: var(--color-surface);
  color: var(--text);
  border-color: var(--line);
}
.secondary:hover {
  background: var(--card2);
}
.text-button,.text-link {
  background: none;
  border: 0;
  color: var(--color-brand);
  padding: 4px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  text-decoration: none;
}
.text-button:hover {
  color: var(--color-brand-hover);
  background: var(--card2);
}
.text-link:hover {
  text-decoration: underline;
}
.danger {
  background: var(--color-danger);
  color: var(--color-surface);
}
.icon-button {
  width: 44px;
  flex: 0 0 44px;
  padding: 10px;
  background: none;
  color: var(--text);
  border-color: var(--line);
}
.icon-button:hover {
  background: var(--card2);
  color: var(--text);
}
.icon,button svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.icon {
  vertical-align: middle;
}
svg {
  max-width: 100%;
}
img {
  max-width: 100%;
  height: auto;
}
input,select,textarea {
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  color: var(--text);
}
input[type=checkbox],input[type=radio] {
  width: 20px;
  min-height: 20px;
  accent-color: var(--color-brand);
}
input::placeholder,textarea::placeholder {
  color: var(--muted);
}
label {
  display: block;
  font-size: .87rem;
  font-weight: 550;
  margin: 12px 0 6px;
}
textarea {
  resize: vertical;
  min-height: 100px;
}
:focus-visible {
  outline: 3px solid var(--color-accent);
  outline-offset: 3px;
}
::selection {
  background: #c9dbcd;
  color: #173222;
}
[hidden],.hidden {
  display: none!important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  inset-inline-start: 20px;
  top: -80px;
  background: var(--card);
  padding: 12px;
  z-index: 300;
}
.skip-link:focus {
  top: 10px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.between {
  justify-content: space-between;
}
.status,.meta,.notice {
  color: var(--muted);
  font-size: .85rem;
  line-height: 1.9;
}
.status {
  min-height: 1.5em;
  margin-top: 8px;
}
.bad {
  color: var(--color-danger);
}
.ok {
  color: var(--color-success);
}
.gold {
  color: var(--color-accent);
}
.notice {
  border-inline-start: 3px solid var(--color-accent);
  padding: 14px 18px;
  background: var(--card2);
  border-radius: 4px;
}
.pill,.badge {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 50px;
  padding: 3px 10px;
  font-size: .75rem;
  color: var(--muted);
}
.site-header {
  border-bottom: 1px solid var(--line);
  background: var(--card);
  position: relative;
  z-index: 20;
}
.header-inner {
  max-width: var(--content-width-wide);
  margin: auto;
  min-height: 96px;
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 16px 0;
}
.site-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
  text-decoration: none;
  flex-shrink: 0;
}
.site-brand img {
  width: 43px;
  height: 43px;
}
.site-brand strong {
  font-size: 1.23rem;
  display: block;
  line-height: 1.6;
  font-weight: 700;
}
.site-brand small {
  font-size: .68rem;
  letter-spacing: .05em;
  display: block;
  line-height: 1.5;
  color: var(--muted);
}
.primary-nav {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-inline: auto;
}
.primary-nav a {
  position: relative;
  text-decoration: none;
  color: var(--muted);
  white-space: nowrap;
  font-size: .88rem;
  padding: 10px 0;
}
.primary-nav a[aria-current=page] {
  color: var(--color-brand);
  font-weight: 650;
}
.primary-nav a[aria-current=page]:after {
  content: '';
  position: absolute;
  bottom: 0;
  height: 2px;
  inset-inline: 0;
  background: var(--color-brand);
}
.header-actions {
  display: flex;
  gap: 7px;
}
.header-actions [data-action=language] {
  width: auto;
  display: flex;
  font-size: .65rem;
  gap: 4px;
}
.header-actions [data-action=language] .icon {
  width: 18px;
}
.context-bar {
  max-width: var(--content-width-wide);
  margin: auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: .85rem;
  color: var(--muted);
}
#zadPointsChip {
  margin-inline-start: auto;
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
  font-size: .8rem;
}
#mainContent {
  max-width: var(--content-width-wide);
  margin: 0 auto;
  min-height: 60vh;
  padding: 40px 0 64px;
  outline: 0;
}
.site-footer {
  border-top: 1px solid var(--line);
  max-width: var(--content-width-wide);
  margin: auto;
  padding: 26px 0 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  font-size: .82rem;
  color: var(--muted);
}
.site-footer p {
  margin: 0;
}
.site-footer strong {
  color: var(--text);
}
.eyebrow {
  color: var(--color-accent);
  font-size: .73rem;
  font-weight: 600;
  letter-spacing: normal;
}
.home-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0 40px;
  gap: 20px;
}
.home-intro h1 {
  font-size: 2.5rem;
  line-height: 1.7;
  margin: 5px 0 12px;
}
.home-intro p:last-child {
  color: var(--muted);
  font-size: 1rem;
  margin: 0;
}
.intro-mark {
  width: 116px;
  height: 116px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--color-brand);
  margin-inline-end: 28px;
  flex-shrink: 0;
}
.intro-mark .icon {
  width: 58px;
  height: 58px;
  stroke-width: 1;
}
.daily-invitation {
  background: var(--color-surface-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 26px 30px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.daily-invitation h2 {
  font-size: 1.25rem;
  margin: 2px 0 4px;
}
.daily-invitation p {
  font-size: .85rem;
  color: var(--muted);
  margin: 0;
}
.daily-invitation .button {
  margin-inline-start: auto;
  flex-shrink: 0;
}
.daily-icon {
  color: var(--color-brand);
  width: 52px;
  height: 60px;
  border-inline-end: 1px solid var(--line);
  display: flex;
  align-items: center;
}
.daily-icon .icon {
  width: 32px;
  height: 32px;
}
.section-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 38px 0 17px;
  gap: 16px;
}
.section-label h2 {
  font-size: 1.07rem;
  margin: 0;
}
.section-label span {
  font-size: .8rem;
  color: var(--muted);
}
.gateway-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 20px;
}
.gateway-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 26px 26px 20px;
  display: flex;
  flex-direction: column;
}
.gateway-card-top {
  display: flex;
  justify-content: space-between;
  color: var(--color-brand);
  margin-bottom: 28px;
}
.gateway-number {
  font: 400 .73rem/1.8 var(--font-ui);
  color: var(--muted);
}
.gateway-card h2 {
  font-size: 1.32rem;
  margin-bottom: 8px;
}
.gateway-card h2 a {
  color: var(--text);
  text-decoration: none;
}
.gateway-card p {
  color: var(--muted);
  font-size: .88rem;
  line-height: 2.05;
  min-height: 3.6em;
}
.gateway-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin: 12px 0 26px;
  font-size: .72rem;
  color: var(--muted);
}
.gateway-open {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 15px;
  text-decoration: none;
  font-size: .82rem;
  margin-top: auto;
}
.gateway-open .icon {
  width: 18px;
}
.quiet-links {
  display: flex;
  gap: 30px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 26px;
}
.quiet-links a {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: .8rem;
  text-decoration: none;
}
.quiet-links a:last-child {
  margin-inline-start: auto;
}
.quiet-links small {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 6px;
  color: var(--muted);
}
.breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: .8rem;
  color: var(--muted);
  margin-bottom: 18px;
}
.breadcrumb a {
  text-decoration: none;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.page-heading h1 {
  margin: 0;
}
.page-heading .text-link {
  font-size: .83rem;
}
.section-intro,.v21SectionIntro {
  max-width: 760px;
  color: var(--muted);
  margin: 16px 0 30px;
  font-size: .96rem;
}
.module-grid,.v21SectionGrid,.v21TopicGrid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}
.module-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 25px;
  display: flex;
  align-items: flex-start;
  gap: 18px;
}
.module-card h3 {
  margin: 0 0 6px;
}
.module-card h3 a {
  color: var(--text);
  text-decoration: none;
}
.module-card p {
  color: var(--muted);
  font-size: .84rem;
  margin: 0;
}
.module-icon {
  color: var(--color-brand);
  padding-top: 4px;
}
.module-open {
  margin-inline-start: auto;
  align-self: center;
  flex-shrink: 0;
}
.v21KnowledgeDisclaimer {
  margin: 24px 0;
  padding: 18px 22px;
  border-inline-start: 3px solid var(--color-accent);
  background: var(--card2);
  font-size: .87rem;
  color: var(--muted);
}
.v21KnowledgeDisclaimer h3 {
  color: var(--text);
  font-size: .96rem;
  margin: 0 0 5px;
}
.v21KnowledgeDisclaimer p {
  margin: 0;
}
.v21TopicCard {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 24px;
  background: var(--card);
}
.v21TopicCard p {
  color: var(--muted);
  font-size: .86rem;
}
.v21TopicCard .glyph {
  color: var(--color-brand);
  margin-bottom: 14px;
}
.v21AqidahPdfBtn,.v21TafsirPdfBtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  font-size: .85rem;
}
.v21TafsirComingSoon {
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 3px 12px;
  border-radius: 4px;
}
.v21AqidahGuidance {
  margin-top: 24px;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--card);
}
.v21AqidahGuidance blockquote {
  font: 400 1.35rem/2.1 var(--font-quran);
  margin: 16px 0;
}
.v21AqidahGuidance p {
  color: var(--muted);
}
.empty-state,.empty,.v21Reserved {
  padding: 40px 24px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
  color: var(--muted);
  margin-block: 20px;
}
.empty-state h2,.empty h2 {
  margin-top: 15px;
  color: var(--text);
}
.empty-state .icon {
  width: 32px;
  height: 32px;
}
.empty-state p {
  max-width: 560px;
  margin: 0 auto 18px;
}
.search-field {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  margin: 0;
}
.search-field>.icon {
  position: absolute;
  inset-inline-start: 14px;
  color: var(--muted);
}
.search-field input {
  padding-inline-start: 46px;
}
.site-toast,.heartToast {
  position: fixed;
  inset-inline-start: 50%;
  bottom: 25px;
  transform: translateX(50%);
  background: var(--text);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  max-width: min(90vw,550px);
  display: none;
  font-size: .86rem;
  text-align: center;
}
[dir=ltr] .site-toast,[dir=ltr] .heartToast {
  transform: translateX(-50%);
}
.site-toast.show,.heartToast.show {
  display: block;
}
.greeting-note {
  position: fixed;
  bottom: 20px;
  inset-inline-end: 24px;
  max-width: 340px;
  z-index: 45;
  background: var(--card);
  border: 1px solid var(--line);
  border-inline-start: 3px solid var(--color-accent);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px 46px 18px 20px;
}
.greeting-note p {
  margin: 0;
  font-size: .9rem;
  line-height: 2;
}
.greeting-note button {
  position: absolute;
  inset-inline-end: 0;
  top: 0;
  background: none;
  color: var(--muted);
  padding: 8px;
  min-width: 44px;
  min-height: 44px;
}
.greeting-note small {
  color: var(--muted);
}
dialog {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0;
  max-width: min(620px,calc(100% - 24px));
  width: 620px;
  max-height: calc(100dvh - 36px);
  box-shadow: var(--shadow-lg);
}
dialog::backdrop {
  background: #13291c70;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 16px 24px;
}
.dialog-head h2 {
  margin: 0;
  font-size: 1.15rem;
}
.dialog-body {
  padding: 24px;
  overflow: auto;
}
.dialog-body>p {
  color: var(--muted);
  font-size: .9rem;
}
.settings-group {
  padding-bottom: 22px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
}
.settings-group:last-child {
  border: 0;
  padding: 0;
  margin: 0;
}
.settings-group h3 {
  font-size: .9rem;
  margin-bottom: 10px;
}
.segmented {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.segmented button {
  background: var(--card2);
  color: var(--text);
  border-color: var(--line);
  flex: 1;
  font-size: .8rem;
}
.segmented button[aria-pressed=true] {
  border-color: var(--color-brand);
  color: var(--color-brand);
  background: var(--card);
}
.settings-link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: transparent;
  color: var(--text);
  border-color: var(--line);
  text-align: start;
  margin-top: 10px;
}
.settings-link small {
  color: var(--muted);
}
.global-results {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}
.global-results a {
  display: block;
  text-decoration: none;
  background: var(--card2);
  padding: 13px 15px;
  border-radius: 6px;
}
.global-results strong {
  display: block;
  font-size: .93rem;
}
.global-results small {
  color: var(--muted);
}
.search-no-results {
  color: var(--muted);
  font-size: .9rem;
  padding: 20px 0;
}
.standalone-main {
  max-width: var(--content-width-wide);
  margin: auto;
  padding: 36px 0 64px;
}
.standalone-header .header-inner {
  justify-content: space-between;
}
.standalone-header a:last-child {
  font-size: .85rem;
}
@media(min-width:800px) {
  .site-header {
    position: sticky;
    top: 0;
  }
  .site-header .header-inner {
    min-height: 86px;
  }
}
@media(max-width:1180px) {
  .header-inner,.context-bar,#mainContent,.site-footer,.standalone-main {
    margin-inline: 24px;
  }
  .header-inner {
    gap: 20px;
  }
  .primary-nav {
    gap: 18px;
  }
}
@media(max-width:850px) {
  .header-inner {
    flex-wrap: wrap;
    gap: 15px;
    min-height: auto;
    padding: 18px 0 0;
  }
  .primary-nav {
    order: 3;
    width: 100%;
    justify-content: center;
    gap: 28px;
    border-top: 1px solid var(--line);
    margin: 0;
  }
  .primary-nav a {
    font-size: .85rem;
    padding: 12px 0;
  }
  .header-actions {
    margin-inline-start: auto;
  }
  .site-brand strong {
    font-size: 1.13rem;
  }
  .site-brand img {
    width: 38px;
    height: 38px;
  }
  .header-actions .icon-button {
    width: 44px;
    min-height: 44px;
    flex-basis: 44px;
    padding: 8px;
  }
  .header-actions [data-action=language] .icon {
    display: none;
  }
  .gateway-grid {
    gap: 12px;
  }
  .gateway-card {
    padding: 20px;
  }
  .gateway-card h2 {
    font-size: 1.2rem;
  }
  .gateway-topics {
    gap: 7px;
  }
  .intro-mark {
    margin: 0;
    width: 88px;
    height: 88px;
  }
  .home-intro h1 {
    font-size: 2.1rem;
  }
  .standalone-header .header-inner {
    padding-bottom: 18px;
  }
  .module-card {
    padding: 20px;
  }
  .daily-invitation {
    padding: 24px;
    gap: 18px;
  }
  .daily-icon {
    display: none;
  }
}
@media(max-width:640px) {
  body {
    font-size: 14px;
  }
  .header-inner,.context-bar,#mainContent,.site-footer,.standalone-main {
    margin-inline: 18px;
  }
  #mainContent {
    padding: 24px 0 40px;
  }
  .header-actions {
    gap: 5px;
  }
  .header-actions .icon-button {
    width: 44px;
    flex-basis: 44px;
  }
  .site-brand {
    gap: 8px;
  }
  .site-brand strong {
    font-size: 1rem;
  }
  .site-brand img {
    width: 33px;
    height: 33px;
  }
  .site-brand small {
    font-size: .57rem;
  }
  .primary-nav {
    gap: 22px;
  }
  .home-intro {
    padding: 15px 0 28px;
  }
  .home-intro h1 {
    font-size: 1.72rem;
    margin-bottom: 12px;
  }
  .intro-mark {
    display: none;
  }
  .home-intro p:last-child {
    font-size: .9rem;
  }
  .daily-invitation {
    display: grid;
    grid-template-columns: 1fr;
    padding: 20px;
    gap: 18px;
  }
  .daily-invitation .button {
    margin-inline-start: 0;
    justify-self: start;
    font-size: .85rem;
  }
  .daily-invitation h2 {
    font-size: 1.15rem;
  }
  .section-label {
    margin: 28px 0 14px;
  }
  .section-label span {
    font-size: .7rem;
  }
  .gateway-grid,.module-grid,.v21SectionGrid,.v21TopicGrid {
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .gateway-card {
    padding: 22px;
  }
  .gateway-card-top {
    margin-bottom: 18px;
  }
  .gateway-card p {
    min-height: 0;
    font-size: .86rem;
  }
  .gateway-topics {
    margin: 8px 0 18px;
  }
  .gateway-card h2 {
    font-size: 1.3rem;
  }
  .quiet-links {
    gap: 18px 24px;
    margin-top: 24px;
  }
  .quiet-links a:last-child {
    margin: 0;
  }
  .site-footer {
    flex-wrap: wrap;
    padding-top: 20px;
    gap: 10px;
  }
  .site-footer p {
    flex-basis: 100%;
    order: 3;
    font-size: .76rem;
  }
  .page-heading h1 {
    font-size: 1.65rem;
  }
  .module-card {
    padding: 20px;
    gap: 12px;
  }
  .section-intro,.v21SectionIntro {
    font-size: .88rem;
    margin: 14px 0 24px;
  }
  .greeting-note {
    inset-inline: 18px;
    bottom: 18px;
    max-width: none;
  }
  .dialog-head,.dialog-body {
    padding: 18px;
  }
  .context-bar {
    gap: 8px;
    font-size: .75rem;
  }
  .context-bar button {
    padding: 6px 9px;
    font-size: .75rem;
  }
  .v21KnowledgeDisclaimer {
    padding: 16px;
  }
  .icon-button .icon {
    width: 20px;
    height: 20px;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation: none!important;
    transition: none!important;
    scroll-behavior: auto!important;
  }
}
[dir=ltr] .gateway-open .icon,[dir=ltr] .module-open .icon,[dir=ltr] .daily-invitation .button .icon,[dir=ltr] .book-copy .text-link .icon {
  transform: scaleX(-1);
}
.module-open {
  min-width: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
}
@media(max-width:390px) {
  .header-inner {
    justify-content: center;
  }
  .header-actions {
    margin-inline: 0;
  }
  .primary-nav {
    gap: 18px;
  }
  .primary-nav a {
    font-size: .78rem;
  }
}

/* Full-page palettes: the same component geometry, with tinted semantic surfaces. */
:root[data-accent="emerald"] {
  --color-bg: #f7f6f1;
  --color-surface: #fffefa;
  --color-surface-alt: #edefe8;
  --color-border: #dce0d7;
  --color-brand: #275b45;
  --color-brand-hover: #194932;
  --color-accent: #806630;

  --color-muted: #5d685f;
}
:root[data-theme="dark"][data-accent="emerald"] {
  --color-bg: #141d18;
  --color-surface: #1c2720;
  --color-surface-alt: #253329;
  --color-border: #38483b;
  --color-brand: #a5c7ac;
  --color-brand-hover: #c1d8c5;
  --color-accent: #d1b875;
  --color-text: #eeefe8;

:root[data-accent="olive"] {
  --color-bg: #f5f5ec;

  --color-muted: #616752;
}
:root[data-theme="dark"][data-accent="olive"] {
  --color-bg: #1b1e15;
  --color-surface: #262b1d;
  --color-surface-alt: #333b27;
  --color-border: #49543a;
  --color-brand: #b6c69a;
  --color-brand-hover: #cfdbba;
  --color-accent: #c3cca3;
  --color-text: #f0f1e7;

:root[data-accent="navy"] {

  --color-border: #ccd5df;

  --color-brand-hover: #223b50;
  --color-accent: #4c6175;
  --color-text: #26303a;
  --color-muted: #5c6670;

:root[data-theme="dark"][data-accent="navy"] {
  --color-bg: #151d27;
  --color-surface: #1d2936;
  --color-surface-alt: #273648;
  --color-border: #52667c;
  --color-brand: #afc4d8;
  --color-brand-hover: #cfdeeb;
  --color-accent: #bbcfdf;
  --color-text: #eef2f6;
  --color-muted: #b2c0d0;
}
[data-swatch="navy"] {background:#344f66;}
:root[data-accent="burgundy"] {
  --color-bg: #f7f1f1;
  --color-surface: #fffafa;

  "heart-hadith.d1b7b6bf53": {

  "heart-hadith.5283d35d7e": {

  "heart-hadith.52bb5a3d5b": {

  "heart-hadith.f0c17f9066": {

  "heart-hadith.466da69421": {

  "heart-hadith.667326d92d": {

  "heart-hadith.1aca5d532f": {

  "heart-hadith.2a3b51276e": {

  "heart-hadith.bec819a5b1": {

    "en": "Breathe calmly, repeat the supplication, then write the smallest step you can take now.",
    "fr": "Respirez calmement, répétez l’invocation puis notez le plus petit pas possible maintenant.",
    "id": "Bernapas tenang, ulangi doa, lalu tulis langkah terkecil yang dapat dilakukan sekarang.",
    "tr": "Sakince nefes alın, duayı tekrarlayın ve şimdi atabileceğiniz en küçük adımı yazın.",
    "ur": "اطمینان سے سانس لیں، دعا دہرائیں، پھر ابھی ممکن سب سے چھوٹا قدم لکھیں۔",
    "es": "Respira con calma, repite la súplica y anota el menor paso que puedas dar ahora."
  },
  "heart-hadith.07267e2345": {
    "ar": "خائف",
    "en": "Afraid",
    "fr": "Inquiet",
    "id": "Takut",
    "tr": "Korkmuş",
    "ur": "خوف زدہ",
    "es": "Miedo"
  },
  "heart-hadith.ccc9e82619": {
    "ar": "سمِّ الخوف بوضوح، وخذ سببًا آمنًا ومشروعًا، ولا تواجه خطرًا حقيقيًا وحدك.",
    "en": "Name your fear, take a safe and lawful precaution, and do not face real danger alone.",
    "fr": "Nommez votre peur, prenez une précaution sûre et licite et ne faites pas face seul à un danger réel.",
    "id": "Kenali ketakutan, ambil langkah aman dan dibolehkan, dan jangan hadapi bahaya nyata sendirian.",
    "tr": "Korkunuzu tanımlayın, güvenli ve meşru tedbir alın; gerçek tehlikeyle yalnız yüzleşmeyin.",
    "ur": "خوف واضح کریں، محفوظ جائز تدبیر لیں اور حقیقی خطرے کا اکیلے مقابلہ نہ کریں۔",
    "es": "Identifica tu miedo, toma una precaución segura y lícita y no afrontes un peligro real a solas."
  },
  "heart-hadith.a1cadecdfa": {
    "ar": "وقعت في ذنب",
    "en": "I have sinned",
    "fr": "J’ai commis une faute",
    "id": "Saya berbuat dosa",
    "tr": "Günah işledim",
    "ur": "مجھ سے گناہ ہوا ہے",
    "es": "He pecado"
  },
  "heart-hadith.664067f022": {
    "ar": "توقف عن الذنب، واندم، واعزم على عدم الرجوع، وردّ الحقوق إلى أهلها إن تعلقت بالناس.",
    "en": "Stop the sin, feel remorse, resolve not to return, and restore others’ rights where relevant.",
    "fr": "Cessez la faute, regrettez-la, décidez de ne pas recommencer et restituez les droits d’autrui.",
    "id": "Hentikan dosa, sesali, bertekad tidak mengulanginya, dan kembalikan hak orang lain jika terkait.",
    "tr": "Günahı bırakın, pişman olun, dönmemeye karar verin ve varsa kul haklarını iade edin.",
    "ur": "گناہ چھوڑیں، نادم ہوں، نہ لوٹنے کا عزم کریں اور لوگوں کے حقوق واپس کریں۔",
    "es": "Deja el pecado, arrepiéntete, decide no repetirlo y restituye los derechos ajenos cuando corresponda."
  },
  "heart-hadith.a88be6bfd5": {
    "ar": "أشعر بالفتور",
    "en": "Feeling unmotivated",
    "fr": "Manque d’élan",
    "id": "Kurang semangat",
    "tr": "İsteksiz hissediyorum",
    "ur": "سستی محسوس ہو رہی ہے",
    "es": "Desánimo"
  },
  "heart-hadith.b731956fce": {
    "ar": "لا تضع خطة كبيرة؛ صلِّ الفرض في وقته واقرأ صفحة واحدة فقط اليوم.",
    "en": "Keep it small: pray on time and read just one Quran page today.",
    "fr": "Restez simple : priez à l’heure et lisez une seule page aujourd’hui.",
    "id": "Mulai sederhana: salat tepat waktu dan baca satu halaman Al-Quran hari ini.",
    "tr": "Planı küçük tutun: namazı vaktinde kılın ve bugün yalnızca bir sayfa okuyun.",
    "ur": "بڑا منصوبہ نہ بنائیں؛ وقت پر فرض پڑھیں اور آج صرف ایک صفحہ پڑھیں۔",
    "es": "Hazlo sencillo: reza a tiempo y lee solo una página del Corán hoy."
  },
  "heart-hadith.40591428db": {
    "ar": "غاضب",
    "en": "Angry",
    "fr": "En colère",
    "id": "Marah",
    "tr": "Öfkeli",
    "ur": "غصے میں",
    "es": "Enfado"
  },
  "heart-hadith.ee3f20db64": {
    "ar": "توقف عن الكلام دقيقة، وغيّر مكانك، ولا ترسل رسالة وأنت في ذروة الغضب.",
    "en": "Stop speaking for a minute, change your place, and do not message at the peak of anger.",
    "fr": "Taisez-vous une minute, changez de lieu et n’envoyez pas de message au plus fort de la colère.",
    "id": "Berhenti bicara semenit, pindah tempat, dan jangan kirim pesan saat amarah memuncak.",
    "tr": "Bir dakika konuşmayın, yer değiştirin ve öfkenin zirvesinde mesaj göndermeyin.",
    "ur": "ایک منٹ خاموش رہیں، جگہ بدلیں اور شدید غصے میں پیغام نہ بھیجیں۔",
    "es": "Calla un minuto, cambia de lugar y no envíes mensajes en plena ira."
  },
  "heart-hadith.646071a3e1": {
    "ar": "أشعر بالوحدة",
    "en": "Feeling lonely",
    "fr": "Solitude",
    "id": "Kesepian",
    "tr": "Yalnız hissediyorum",
    "ur": "تنہائی محسوس ہو رہی ہے",
    "es": "Soledad"
  },
  "heart-hadith.53e7ec071c": {
    "ar": "صلِّ ركعتين، ثم تواصل مع شخص صالح تثق به بدل أن تبقى وحدك مع أفكارك.",
    "en": "Pray two rak‘ahs, then contact a trusted, upright person instead of staying alone with your thoughts.",
    "fr": "Priez deux unités, puis contactez une personne pieuse de confiance au lieu de rester seul avec vos pensées.",
    "id": "Salat dua rakaat, lalu hubungi orang saleh tepercaya daripada terus sendirian dengan pikiran Anda.",
    "tr": "İki rekât namaz kılın, sonra düşüncelerinizle yalnız kalmak yerine güvendiğiniz salih birine ulaşın.",
    "ur": "دو رکعت پڑھیں، پھر خیالات میں اکیلے رہنے کے بجائے معتبر نیک شخص سے رابطہ کریں۔",
    "es": "Reza dos rak‘ahs y contacta con una persona recta de confianza en vez de quedarte a solas con tus pensamientos."
  },
  "heart-hadith.78d9f97f58": {
    "ar": "أريد الثبات",
    "en": "Seeking steadfastness",
    "fr": "Besoin de constance",
    "id": "Ingin istiqamah",
    "tr": "Sebat istiyorum",
    "ur": "ثابت قدمی چاہتا ہوں",
    "es": "Busco constancia"
  },
  "heart-hadith.64583bee32": {
    "ar": "ثبّت عبادة واحدة في موعد محدد لمدة سبعة أيام، ولا تزد عليها حتى تستقر.",
    "en": "Keep one act of worship at a fixed time for seven days before adding more.",
    "fr": "Gardez une pratique à heure fixe sept jours avant d’en ajouter d’autres.",
    "id": "Jaga satu ibadah pada waktu tetap selama tujuh hari sebelum menambahnya.",
    "tr": "Yeni bir şey eklemeden önce bir ibadeti yedi gün sabit saatte sürdürün.",
    "ur": "مزید بڑھانے سے پہلے ایک عبادت مقرر وقت پر سات دن قائم رکھیں۔",
    "es": "Mantén una práctica a una hora fija durante siete días antes de añadir más."
  },
  "heart-hadith.1168258371": {
    "ar": "أريد شكر الله",
    "en": "Seeking gratitude",
    "fr": "Besoin de gratitude",
    "id": "Ingin bersyukur",
    "tr": "Şükretmek istiyorum",
    "ur": "شکر کرنا چاہتا ہوں",
    "es": "Busco gratitud"
  },
  "heart-hadith.4213ee83a8": {
    "ar": "اكتب ثلاث نعم، واستعمل واحدة منها اليوم في طاعة أو نفع إنسان.",
    "en": "Write three blessings and use one today in worship or helping someone.",
    "fr": "Notez trois bienfaits et utilisez-en un aujourd’hui pour adorer Allah ou aider quelqu’un.",
    "id": "Tulis tiga nikmat dan gunakan satu untuk beribadah atau membantu orang hari ini.",
    "tr": "Üç nimet yazın ve bugün birini ibadet veya birine fayda için kullanın.",
    "ur": "تین نعمتیں لکھیں اور ایک کو آج اطاعت یا کسی کی مدد میں استعمال کریں۔",
    "es": "Anota tres bendiciones y usa una hoy en la adoración o para ayudar a alguien."
  },
  "heart-hadith.394bb63fee": {
    "ar": "قسّم ما يشغلك إلى خطوة صغيرة تفعلها الآن، وما لا تقدر عليه ففوّضه إلى الله.",
    "en": "Break your concern into a small step for now; entrust what you cannot control to Allah.",
    "fr": "Réduisez votre souci à un petit pas maintenant ; confiez à Allah ce qui vous échappe.",
    "id": "Uraikan kekhawatiran menjadi langkah kecil sekarang; serahkan yang tak dikuasai kepada Allah.",
    "tr": "Kaygınızı şimdi atılacak küçük bir adıma bölün; elinizde olmayanı Allah’a bırakın.",
    "ur": "فکر کو ابھی کے چھوٹے قدم میں تقسیم کریں، باقی اللہ کے سپرد کریں۔",
    "es": "Convierte tu preocupación en un pequeño paso actual y confía a Allah lo que no controlas."
  },
  "heart-hadith.e823f465da": {
    "ar": "خذ سبب الأمان الممكن، ثم اقطع تكرار الخوف في ذهنك بذكر الله والتنفس الهادئ.",
    "en": "Take available safety precautions, then interrupt fearful thoughts with remembrance and calm breathing.",
    "fr": "Prenez les précautions possibles, puis interrompez les pensées de peur par le dhikr et une respiration calme.",
    "id": "Ambil tindakan aman yang tersedia, lalu hentikan pikiran takut dengan zikir dan napas tenang.",
    "tr": "Mümkün güvenlik tedbirlerini alın; sonra korku döngüsünü zikir ve sakin nefesle bölün.",
    "ur": "ممکن حفاظتی تدبیر لیں، پھر ذکر اور پرسکون سانس سے خوف کا سلسلہ توڑیں۔",
    "es": "Toma las precauciones posibles y corta el ciclo del miedo con recuerdo y respiración tranquila."
  },
  "heart-hadith.28ea7394b3": {
    "ar": "استغفر بصدق، ثم أبعد السبب الذي يعيدك إلى الذنب واتبع التوبة بعمل صالح.",
    "en": "Seek forgiveness sincerely, remove a trigger for sin, and follow repentance with a good deed.",
    "fr": "Demandez sincèrement pardon, écartez une cause de faute et faites suivre le repentir d’un bien.",
    "id": "Mohon ampun dengan tulus, jauhkan pemicu dosa, dan ikuti tobat dengan amal baik.",
    "tr": "İçtenlikle istiğfar edin, günaha götüren sebebi kaldırın ve tövbeyi bir iyilikle izleyin.",
    "ur": "سچے دل سے استغفار کریں، گناہ کا سبب دور کریں اور توبہ کے بعد نیکی کریں۔",
    "es": "Pide perdón con sinceridad, aparta un motivo de pecado y sigue el arrepentimiento con una buena obra."
  },
  "heart-hadith.1f684b5873": {
    "ar": "اختر عبادة صغيرة ثابتة اليوم: صفحة قرآن، أو ركعتان، أو مئة استغفار.",
    "en": "Choose one small practice today: a Quran page, two rak‘ahs, or a hundred requests for forgiveness.",
    "fr": "Choisissez une petite pratique : une page du Coran, deux unités de prière ou cent demandes de pardon.",
    "id": "Pilih satu ibadah kecil: satu halaman Al-Quran, dua rakaat, atau seratus istigfar.",
    "tr": "Bugün küçük bir ibadet seçin: bir sayfa Kur’an, iki rekât veya yüz istiğfar.",
    "ur": "آج چھوٹی عبادت منتخب کریں: ایک صفحہ، دو رکعت یا سو استغفار۔",
    "es": "Elige una práctica pequeña: una página del Corán, dos rak‘ahs o cien peticiones de perdón."
  },
  "heart-hadith.a431405f67": {
    "ar": "اصمت لحظات، وتوضأ، وأجّل الرد حتى يهدأ غضبك وتستطيع اختيار الكلمة الأحسن.",
    "en": "Pause, make ablution, and delay your reply until you can choose kinder words calmly.",
    "fr": "Faites une pause, vos ablutions et attendez le calme pour choisir de meilleurs mots.",
    "id": "Diam sejenak, berwudu, dan tunda jawaban sampai tenang agar dapat memilih kata yang baik.",
    "tr": "Biraz susun, abdest alın ve daha güzel söz seçebilene kadar cevabı erteleyin.",
    "ur": "کچھ دیر خاموش رہیں، وضو کریں اور اچھا جواب دینے تک انتظار کریں۔",
    "es": "Haz una pausa, ablución y espera a calmarte para responder con mejores palabras."
  },
  "heart-hadith.8a44f229c3": {
    "ar": "ادعُ الله بما في قلبك، ثم تواصل اليوم مع شخص صالح أو قريب تثق به.",
    "en": "Tell Allah what is in your heart, then contact a trusted relative or upright person today.",
    "fr": "Confiez à Allah ce qui vous pèse, puis contactez aujourd’hui un proche ou une personne pieuse de confiance.",
    "id": "Berdoalah kepada Allah tentang isi hati, lalu hubungi kerabat atau orang saleh tepercaya hari ini.",
    "tr": "Kalbinizdekilerle Allah’a dua edin; bugün güvendiğiniz bir yakına veya salih kişiye ulaşın.",
    "ur": "دل کی بات اللہ سے کہیں، پھر آج معتبر قریبی یا نیک شخص سے رابطہ کریں۔",
    "es": "Expresa a Allah lo que llevas dentro y contacta hoy con un familiar o una persona recta de confianza."
  },
  "heart-hadith.b955f9dd94": {
    "ar": "حافظ سبعة أيام على عبادة واحدة في موعد ثابت، ولا تربطها بالحماس المؤقت.",
    "en": "Keep one act of worship at a fixed time for seven days, independent of passing enthusiasm.",
    "fr": "Gardez une pratique à heure fixe sept jours, sans dépendre d’un enthousiasme passager.",
    "id": "Jaga satu ibadah pada waktu tetap tujuh hari, bukan bergantung semangat sesaat.",
    "tr": "Bir ibadeti geçici heyecana bağlamadan yedi gün sabit saatte sürdürün.",
    "ur": "عارضی جوش کے بجائے ایک عبادت مقرر وقت پر سات دن جاری رکھیں۔",
    "es": "Mantén una práctica a hora fija siete días, sin depender del entusiasmo pasajero."
  },
  "heart-hadith.81de244fe8": {
    "ar": "اذكر نعمة محددة، واحمد الله عليها، واستعملها اليوم في طاعة أو نفع غيرك.",
    "en": "Name a blessing, thank Allah for it, and use it today in worship or helping others.",
    "fr": "Nommez un bienfait, remerciez Allah et utilisez-le aujourd’hui pour Lui obéir ou aider autrui.",
    "id": "Sebutkan satu nikmat, syukuri kepada Allah, dan gunakan untuk taat atau membantu orang lain.",
    "tr": "Bir nimeti belirtin, Allah’a şükredin ve bugün onu ibadet veya başkasına fayda için kullanın.",
    "ur": "ایک نعمت یاد کریں، اللہ کا شکر کریں اور اسے اطاعت یا دوسروں کے فائدے میں لگائیں۔",
    "es": "Identifica una bendición, agradece a Allah y úsala hoy para adorar o ayudar."
  },

  "heart-remedies.f8b2da4382": {

  "heart-remedies.560ac317fb": {

  "heart-remedies.0796da835a": {

  "heart-remedies.4c0a294fee": {

  "heart-remedies.31a5da2c03": {

  "heart-remedies.f20e39ed47": {

  "heart-remedies.793a3ba3cf": {

  "heart-remedies.8e0d0f3fe3": {

  "heart-remedies.1707285e82": {

  "heart-remedies.3d79bd71f9": {

  "heart-remedies.c0340ae201": {

  "heart-remedies.752e8968f0": {

  "heart-remedies.a38f2d8bfc": {

  "heart-remedies.0ce07dc173": {

  "heart-remedies.a79bc0b6ba": {

      if(el.dataset.i18n){const last=applied.get(el);if(last===undefined||el.textContent===last||el.textContent.replace(/\p{Extended_Pictographic}\uFE0F?|\uFE0F/gu,'').trim()===last.replace(/\p{Extended_Pictographic}\uFE0F?|\uFE0F/gu,'').trim()){el.textContent=t(el.dataset.i18n);applied.set(el,el.textContent);}}
      for(const attr of ['placeholder','title','aria-label','alt']){const key=el.getAttribute('data-i18n-'+attr);if(key)el.setAttribute(attr,t(key));}
    }
  }
  function setLocale(code){
    if(!languages[code])return false;
    locale=fixedLocale||code;if(!fixedLocale)Zad.storage.setItem(storageKey,code);
    document.documentElement.lang=locale;document.documentElement.dir=languages[locale].dir;
    document.documentElement.dataset.v21Lang=code;

  }

  document.addEventListener('DOMContentLoaded',()=>apply());
  document.addEventListener('zad:language',()=>{apply();document.querySelectorAll('.site-toast,.heartToast').forEach(el=>el.classList.remove('show'));});
  return {t,html,pack,ui,source,apply,setLocale,number,languages,missing,storageKey,get locale(){return locale;}};
})();

<script data-source="assets/js/appearance.js">/* One owner for section colors. Legacy values are read once, never written again. */
window.ZadAppearance = (() => {
  'use strict';
  const names=Object.freeze(['emerald','olive','navy','burgundy','sand','teal','terracotta']);
  const storageKey='zad_scoped_palettes_v1';
  const scopes=new Set(['home','iman','ilm','library','aqidah','seerah','tafsir','more','media','rouh','wird','zad','heart','hadith','reader','admin']);
  const legacyKeys={wird:'wird_palette_v1',zad:'zad_palette_v1',heart:'heart_palette_v1',hadith:'hadith_palette_v1'};
  const legacyNames={mono:'sand',red:'burgundy',gold:'sand',purple:'burgundy',blue:'navy',rose:'burgundy',orange:'terracotta','grad-emerald-blue':'emerald','grad-purple-rose':'burgundy','grad-gold-orange':'sand','grad-blue-purple':'navy','grad-teal-blue':'teal','grad-red-purple':'burgundy','custom-gradient':'emerald'};
  const normalize=value=>names.includes(value)?value:(Object.hasOwn(legacyNames,value)?legacyNames[value]:null);
  function scopeFor(route){
    const file=location.pathname.split('/').pop().toLowerCase();
    if(file==='admin.html')return 'admin';
    if(file==='reader.html')return 'reader';
    if(file==='seerah.html')return 'seerah';
    const candidate=String(route??window.ZadCurrentRoute??Zad.initialRoute??'home').replace(/^#/,'').split('-')[0]||'home';
    return scopes.has(candidate)?candidate:'home';
  }
  let current=scopeFor();
  let saved=Zad.readJSON(storageKey,{});
  if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={};
  saved=Object.fromEntries(Object.entries(saved).filter(([scope,color])=>scopes.has(scope)&&scope!=='admin'&&names.includes(color)));
  function remember(scope,value){saved[scope]=value;Zad.storage.setItem(storageKey,JSON.stringify(saved));}
  function get(scope=current){
    if(scope==='admin')return 'emerald';
    if(saved[scope])return saved[scope];
    const migrated=legacyKeys[scope]&&normalize(Zad.storage.getItem(legacyKeys[scope]));
    if(migrated){remember(scope,migrated);return migrated;}
    return normalize(Zad.storage.getItem('zad_accent_v1'))||'emerald';
  }
  function activate(scope=scopeFor()){
    current=scopes.has(scope)?scope:'home';
    const value=get(current),root=document.documentElement;
    root.removeAttribute('data-palette');
    root.dataset.colorScope=current;
    root.dataset.accent=value;
    document.querySelectorAll('[data-accent-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.accentOption===value)));
    return value;
  }
  function set(value,scope=current){
    const color=normalize(value);
    if(!color||!scopes.has(scope)||scope==='admin')return false;
    remember(scope,color);
    if(scope===current)activate(scope);
    return true;
  }
  document.addEventListener('zad:route',event=>activate(scopeFor(event.detail?.view)));
  activate();
  return {names,storageKey,normalize,scopeFor,get,set,activate,get scope(){return current;}};
})();
</script>

  }

  function filter() {

})();

<script data-source="assets/js/document-reader.js">/* Native PDF viewing is opt-in; original/open/download links remain usable on every device. */
(() => {
  'use strict';
  const id = new URLSearchParams(location.search).get('book') || 'quran';
  const book = ZadDocuments.find(b => b.id === id),
    host = document.getElementById('documentContent'),
    e = Zad.escape;
  const lang = Zad.storage.getItem('zad_islam_language_v3') || 'ar',
    ar = lang === 'ar';
  document.documentElement.lang = ['ar', 'en', 'fr', 'id', 'tr', 'ur', 'es'].includes(lang) ? lang : 'ar';
  document.documentElement.dir = ['ar', 'ur'].includes(lang) ? 'rtl' : 'ltr';
  if (!book) {
    document.title=ZadI18n.t("document-reader.0746b42655")+" | "+ZadI18n.t("gateways.eeeabade98");
    host.innerHTML = `<div class="empty-state"><h1>${ZadI18n.t("document-reader.0746b42655")}</h1><p>${ZadI18n.t("document-reader.b995f89e77")}</p><a class="button" href="index.html#library">${ZadI18n.t("document-reader.931ad23062")}</a></div>`;
    return;
  }
  const title = ar || lang === 'ur' ? book.title : book.englishTitle;
  document.title = title + ' | ' + ZadI18n.t("gateways.eeeabade98");
  const key = 'zad_pdf_page_' + book.id;
  const savedPage = Number(Zad.storage.getItem(key)) || 1;
  const page = Number.isFinite(savedPage) ? Math.max(1, Math.min(book.pages, savedPage)) : 1;
  Zad.storage.setItem('zad_last_book_v1', book.id);
  host.innerHTML = `<nav class="breadcrumb" aria-label="${ZadI18n.t("document-reader.95e840d5b7")}"><a href="index.html#home">${ZadI18n.t("quran-reader.bfcf483079")}</a><span>/</span><a href="index.html#library">${ZadI18n.t("document-reader.9ff4670ff4")}</a><span>/</span><span aria-current="page">${e(title)}</span></nav><section class="document-details"><div class="book-cover ${book.category}" aria-hidden="true"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9IiMyNzViNDUiLz48cGF0aCBkPSJNMzIuOSAzMS44QTE0LjMgMTQuMyAwIDAgMSAyMi40IDExYTE0LjMgMTQuMyAwIDEgMCAxMC41IDIwLjhaIiBmaWxsPSIjZjNlZWRmIi8+PC9zdmc+" alt="" width="32" height="32"><span lang="ar" dir="rtl">${e(book.title)}</span><small lang="ar" dir="rtl">${e(book.author)}</small></div><div><span class="eyebrow">${book.category==='quran'?ZadI18n.t("document-reader.355bd9c0e1"):ZadI18n.t("gateways.4c70ca74a0")}</span><h1 dir="auto">${e(title)}</h1>${book.author?`<p lang="ar" dir="rtl">${e(book.author)}</p>`:''}<div class="document-meta"><span>PDF</span><span>${book.pages.toLocaleString(lang)} ${ZadI18n.t("document-reader.b7ef0df4eb")}</span></div><div class="document-actions"><button type="button" id="startReading">${Zad.icon('book')}${ZadI18n.t("document-reader.10e70830b7")}</button><a class="button secondary" href="${book.file}" target="_blank" rel="noopener noreferrer">${ZadI18n.t("document-reader.c6f1cd6f2b")}</a><a class="text-link" href="${book.file}" download>${Zad.icon('download')}${ZadI18n.t("document-reader.69357e138d")}</a></div></div></section><section class="document-reader" id="documentReader"><div class="document-toolbar"><h2>${ZadI18n.t("document-reader.ace946e49f")}</h2><div class="row"><label for="pdfPage">${ZadI18n.t("document-reader.6b08e93ffb")}</label><input id="pdfPage" type="number" min="1" max="${book.pages}" value="${page}" aria-describedby="readingProgressNote"><button type="button" id="openPage" class="secondary">${ZadI18n.t("document-reader.2afbcf7a78")}</button><button type="button" id="fullScreen" class="secondary">${ZadI18n.t("document-reader.8feab114ea")}</button></div></div><div id="documentViewport" class="document-viewport"><div class="document-placeholder">${Zad.icon('book')}<p>${ZadI18n.t("document-reader.f1e61a56a9")}</p><small>${ZadI18n.t("document-reader.f11f913ce4")}</small></div></div><p class="document-fallback" id="pdfStatus" role="status">${ZadI18n.t("document-reader.8de5747465")} <a href="${book.file}" target="_blank" rel="noopener noreferrer">${ZadI18n.t("document-reader.c6f1cd6f2b")}</a></p></section><p class="reading-progress-note" id="readingProgressNote">${ZadI18n.t("document-reader.f57b06f556")}</p>`;
  const field = document.getElementById('pdfPage'),
    viewport = document.getElementById('documentViewport'),
    status = document.getElementById('pdfStatus');
  let loading = false;
  async function open() {
    if (loading) return;
    const value = Math.round(Number(field.value));
    if (!Number.isFinite(value) || value < 1 || value > book.pages) {
      field.setCustomValidity(ZadI18n.t("document-reader.dca67f553b"));
      field.reportValidity();
      return;
    }
    field.setCustomValidity('');
    loading = true;
    document.getElementById('startReading').disabled = true;
    try {
      if (location.protocol !== 'file:') {
        const response = await Zad.fetch(book.file, {
          method: 'HEAD'
        });
        if (!response.ok) throw new Error('missing_pdf');
      }
      const frame = document.createElement('iframe');
      frame.title = title;
      frame.src = book.file + '#page=' + value + '&view=FitH';
      frame.referrerPolicy = 'same-origin';
      viewport.replaceChildren(frame);
      Zad.storage.setItem(key, String(value));
      viewport.scrollIntoView({
        block: 'start',
        behavior: 'auto'
      });
      frame.addEventListener('error', () => {
        status.firstChild.textContent = ZadI18n.t("document-reader.ddaa751f9e");
      });
    } catch (_) {
      viewport.innerHTML = `<div class="document-placeholder"><h2>${ZadI18n.t("document-reader.9fe0d0dc7d")}</h2><p>${ZadI18n.t("document-reader.4e4f179f3c")}</p></div>`;
    } finally {
      loading = false;
      document.getElementById('startReading').disabled = false;
    }
  }
  document.getElementById('startReading').addEventListener('click', open);
  document.getElementById('openPage').addEventListener('click', open);
  field.addEventListener('input', () => field.setCustomValidity(''));
  const full = document.getElementById('fullScreen'),
    reader = document.getElementById('documentReader');
  if (!reader.requestFullscreen) full.hidden = true;
  full.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await reader.requestFullscreen();
    } catch (_) {
      Zad.toast(ZadI18n.t("document-reader.d3ace77d97"));
    }
  });
  document.addEventListener('fullscreenchange', () => {
    full.textContent = document.fullscreenElement ? ZadI18n.t("document-reader.88bf2fd997") : ZadI18n.t("document-reader.8feab114ea");
  });
})();

</script>
